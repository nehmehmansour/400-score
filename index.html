<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 Score Tracker</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #27ae60;
            --danger: #e74c3c;
            --light: #ecf0f1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary);
            color: white;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        .hidden { display: none; }

        /* Splash Screen */
        #splash-screen img { width: 150px; height: auto; margin-bottom: 20px; }

        /* Name Entry Page */
        h1 { margin-bottom: 20px; color: var(--secondary); }
        .group-box {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1px solid var(--secondary);
        }
        input[type="text"] {
            width: 80%;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            border: none;
            outline: none;
        }
        button {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:disabled { background: #7f8c8d; cursor: not-allowed; }

        /* Scoring Table */
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { border: 1px solid #555; padding: 10px; text-align: center; }
        .total-row { font-weight: bold; background: rgba(39, 174, 96, 0.3); }

        /* Input Controls */
        .bid-select { width: 50px; background: white; color: black; }
        .btn-yes { background: var(--secondary); padding: 5px 10px; border-radius: 5px; margin: 2px; }
        .btn-no { background: var(--danger); padding: 5px 10px; border-radius: 5px; margin: 2px; }

        /* Winner Screen */
        .winner-cup { font-size: 80px; color: gold; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="splash-screen" class="container">
        <img src="logo.png" alt="Logo">
        <h2>400 Score</h2>
    </div>

    <div id="name-entry" class="container hidden">
        <h2>400</h2>
		<h1>PLAYERS NAME</h1>
        <div class="group-box">
            <h3>Group 1</h3>
            <input type="text" id="p1" placeholder="Player 1 Name" oninput="validateForm()">
            <input type="text" id="p2" placeholder="Player 2 Name" oninput="validateForm()">
        </div>
        <div class="group-box">
            <h3>Group 2</h3>
            <input type="text" id="p3" placeholder="Player 3 Name" oninput="validateForm()">
            <input type="text" id="p4" placeholder="Player 4 Name" oninput="validateForm()">
        </div>
        <button id="start-btn" disabled onclick="startGame()">Start Game</button>
    </div>

    <div id="score-sheet" class="container hidden">
        <h1>400 Score</h1>
        <h3 id="round-title">Round 1</h3>
        <table>
            <thead>
                <tr id="player-headers"></tr>
            </thead>
            <tbody id="score-body">
                </tbody>
            <tfoot>
                <tr class="total-row" id="total-scores"></tr>
            </tfoot>
        </table>

        <div id="round-entry" class="group-box">
            <h4 id="entry-title">Enter Round Results</h4>
            <div id="player-inputs"></div>
            <button onclick="submitRound()" id="submit-round-btn" style="margin-top: 15px;">Next Round</button>
        </div>
    </div>

    <div id="winner-page" class="container hidden">
        <div class="winner-cup">🏆</div>
        <h1 id="winner-text">Winners!</h1>
        <button onclick="location.reload()">New Game</button>
    </div>

    <script>
        let players = [];
        let scores = [0, 0, 0, 0];
        let currentRound = 1;

        // Bid Multipliers
        const bidPoints = { 2:2, 3:3, 4:4, 5:10, 6:12, 7:14, 8:16, 9:27, 10:40, 11:44, 12:48, 13:52 };

        // 1. Splash Screen Logic
        setTimeout(() => {
            document.getElementById('splash-screen').classList.add('hidden');
            document.getElementById('name-entry').classList.remove('hidden');
        }, 2000);

        // 2. Form Validation
        function validateForm() {
            const p1 = document.getElementById('p1').value.trim();
            const p2 = document.getElementById('p2').value.trim();
            const p3 = document.getElementById('p3').value.trim();
            const p4 = document.getElementById('p4').value.trim();
            document.getElementById('start-btn').disabled = !(p1 && p2 && p3 && p4);
        }

        // 3. Start Game
        function startGame() {
            players = [
                document.getElementById('p1').value,
                document.getElementById('p2').value,
                document.getElementById('p3').value,
                document.getElementById('p4').value
            ];
            document.getElementById('name-entry').classList.add('hidden');
            document.getElementById('score-sheet').classList.remove('hidden');
            setupTable();
            setupInputs();
        }

        function setupTable() {
            let headers = "<th>Round</th>";
            players.forEach(p => headers += `<th>${p}</th>`);
            document.getElementById('player-headers').innerHTML = headers;
            updateTotals();
        }

        function setupInputs() {
            let html = "";
            players.forEach((p, index) => {
                html += `
                    <div style="margin-bottom:10px;">
                        <span>${p}: </span>
                        <select id="bid-${index}" class="bid-select">
                            ${Object.keys(bidPoints).map(b => `<option value="${b}">${b}</option>`).join('')}
                        </select>
                        <button class="btn-yes" onclick="setResult(${index}, true)">Yes</button>
                        <button class="btn-no" onclick="setResult(${index}, false)">No</button>
                        <span id="status-${index}" style="margin-left:10px;">-</span>
                    </div>
                `;
            });
            document.getElementById('player-inputs').innerHTML = html;
            window.tempResults = [null, null, null, null];
        }

        function setResult(index, won) {
            const bid = document.getElementById(`bid-${index}`).value;
            const points = bidPoints[bid];
            window.tempResults[index] = won ? points : -points;
            document.getElementById(`status-${index}`).innerText = won ? "✅" : "❌";
        }

        // 4. Submit Round
        function submitRound() {
            if (window.tempResults.includes(null)) {
                alert("Please select Yes or No for all players!");
                return;
            }

            // Total bid limit 13 check
            let totalBids = 0;
            players.forEach((_, i) => totalBids += parseInt(document.getElementById(`bid-${i}`).value));
            
            // Logic: In 400, total tricks are 13.
            // (Note: usually we check total tricks taken, but per your rule, we mark results)

            const row = document.createElement('tr');
            row.innerHTML = `<td>R${currentRound}</td>` + window.tempResults.map(r => `<td>${r}</td>`).join('');
            document.getElementById('score-body').appendChild(row);

            window.tempResults.forEach((val, i) => scores[i] += val);
            updateTotals();
            checkWinner();

            currentRound++;
            document.getElementById('round-title').innerText = `Round ${currentRound}`;
            setupInputs();
        }

        function updateTotals() {
            let html = "<td>Total</td>";
            scores.forEach(s => html += `<td>${s}</td>`);
            document.getElementById('total-scores').innerHTML = html;
        }

        // 5. Winning Conditions
        function checkWinner() {
            // Group 1: P1 & P2 | Group 2: P3 & P4
            const check = (idx, partnerIdx) => {
                return (scores[idx] >= 41 && scores[partnerIdx] >= 0);
            };

            if (check(0, 1) || check(1, 0)) {
                showWinner(`${players[0]} & ${players[1]}`);
            } else if (check(2, 3) || check(3, 2)) {
                showWinner(`${players[2]} & ${players[3]}`);
            }
        }

        function showWinner(names) {
            document.getElementById('score-sheet').classList.add('hidden');
            document.getElementById('winner-page').classList.remove('hidden');
            document.getElementById('winner-text').innerText = `${names} WIN!`;
        }
    </script>
</body>
</html>
