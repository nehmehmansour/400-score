<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 Score - Ne3me Cell</title>
    
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" type="image/png" href="logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #27ae60;
            --danger: #e74c3c;
            --warning: #f1c40f;
            --light: #ecf0f1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary);
            color: white;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 95%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        .hidden { display: none; }

        #splash-screen img { width: 120px; height: auto; margin-bottom: 15px; border-radius: 20px; }

        h1 { margin-bottom: 10px; color: var(--secondary); }
        .group-box {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1px solid var(--secondary);
        }
        
        .forced-badge {
            background: var(--danger);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.8em;
            display: inline-block;
            margin-bottom: 10px;
        }

        input[type="text"] {
            width: 80%;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            border: none;
        }

        button {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:disabled { background: #7f8c8d; cursor: not-allowed; }

        table { width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 0.9em; }
        th, td { border: 1px solid #555; padding: 8px; text-align: center; }
        .total-row { font-weight: bold; background: rgba(39, 174, 96, 0.3); }

        .bid-select { width: 60px; padding: 5px; border-radius: 5px; }
        .status-icon { font-size: 1.2em; margin-left: 5px; }
        
        .player-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.05);
            padding: 8px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div id="splash-screen" class="container">
        <img src="logo.png" alt="Logo" onerror="this.src='https://via.placeholder.com/150?text=Ne3me+Cell'">
        <h2>400 Score</h2>
        <p>Ne3me Cell</p>
        <p dir="ltr">+961 76 304 120</p>
    </div>

    <div id="name-entry" class="container hidden">
        <h1>PLAYERS NAMES</h1>
        <div class="group-box">
            <h3>Group 1</h3>
            <input type="text" id="p1" placeholder="Player 1" oninput="validateForm()">
            <input type="text" id="p2" placeholder="Player 2" oninput="validateForm()">
        </div>
        <div class="group-box">
            <h3>Group 2</h3>
            <input type="text" id="p3" placeholder="Player 3" oninput="validateForm()">
            <input type="text" id="p4" placeholder="Player 4" oninput="validateForm()">
        </div>
        <button id="start-btn" disabled onclick="startGame()">Start Game</button>
    </div>

    <div id="score-sheet" class="container hidden">
        <div id="forced-indicator" class="hidden"></div>
        <h2 id="round-title">Round 1</h2>
        
        <table>
            <thead><tr id="player-headers"></tr></thead>
            <tbody id="score-body"></tbody>
            <tfoot><tr class="total-row" id="total-scores"></tr></tfoot>
        </table>

        <div class="group-box">
            <h4>Enter Round Results</h4>
            <div id="player-inputs"></div>
            <div id="total-bid-info" style="margin-top:10px; font-weight:bold;">Total Bids: 0</div>
            <button onclick="submitRound()" id="submit-round-btn" style="margin-top: 15px;">Next Round</button>
        </div>
    </div>

    <div id="winner-page" class="container hidden">
        <h1 style="font-size: 3em;">🏆</h1>
        <h1 id="winner-text">Winners!</h1>
        <button onclick="location.reload()">New Game</button>
    </div>

    <script>
        let players = [];
        let scores = [0, 0, 0, 0];
        let currentRound = 1;
        let tempResults = [null, null, null, null];
        const bidPoints = { 2:2, 3:3, 4:4, 5:10, 6:12, 7:14, 8:16, 9:27, 10:40, 11:44, 12:48, 13:52 };

        setTimeout(() => {
            document.getElementById('splash-screen').classList.add('hidden');
            document.getElementById('name-entry').classList.remove('hidden');
        }, 2000);

        function validateForm() {
            const names = [
                document.getElementById('p1').value.trim(),
                document.getElementById('p2').value.trim(),
                document.getElementById('p3').value.trim(),
                document.getElementById('p4').value.trim()
            ];
            document.getElementById('start-btn').disabled = names.some(n => n === "");
        }

        function startGame() {
            players = [
                document.getElementById('p1').value,
                document.getElementById('p2').value,
                document.getElementById('p3').value,
                document.getElementById('p4').value
            ];
            document.getElementById('name-entry').classList.add('hidden');
            document.getElementById('score-sheet').classList.remove('hidden');
            setupTable();
            setupInputs();
        }

        function setupTable() {
            let headers = "<th>R</th>";
            players.forEach(p => headers += `<th>${p}</th>`);
            document.getElementById('player-headers').innerHTML = headers;
            updateTotals();
        }

        function isAnyoneAbove30() {
            return scores.some(s => s >= 30);
        }

        function setupInputs() {
            let html = "";
            const anyoneAbove30 = isAnyoneAbove30();
            const indicator = document.getElementById('forced-indicator');
            
            if(anyoneAbove30) {
                indicator.innerHTML = `<span class="forced-badge">إجباري (Minimum 13)</span>`;
                indicator.classList.remove('hidden');
            } else {
                indicator.classList.add('hidden');
            }

            players.forEach((p, i) => {
                let minBid = 2;
                if (scores[i] >= 40) minBid = 4;
                else if (scores[i] >= 30) minBid = 3;

                let options = "";
                for (let b = minBid; b <= 13; b++) {
                    options += `<option value="${b}">${b}</option>`;
                }

                html += `
                    <div class="player-row">
                        <div style="text-align:left;">
                            <strong>${p}</strong><br>
                            <small>Score: ${scores[i]}</small>
                        </div>
                        <div>
                            <select id="bid-${i}" class="bid-select" onchange="updateTotalBidCount()">
                                ${options}
                            </select>
                            <button style="padding:5px 10px; background:#27ae60;" onclick="setResult(${i}, true)">✔</button>
                            <button style="padding:5px 10px; background:#e74c3c;" onclick="setResult(${i}, false)">✖</button>
                            <span id="status-${i}" class="status-icon">-</span>
                        </div>
                    </div>
                `;
            });
            document.getElementById('player-inputs').innerHTML = html;
            tempResults = [null, null, null, null];
            updateTotalBidCount();
        }

        function updateTotalBidCount() {
            let total = 0;
            for(let i=0; i<4; i++) {
                total += parseInt(document.getElementById(`bid-${i}`).value);
            }
            const minRequired = isAnyoneAbove30() ? 13 : 12;
            const info = document.getElementById('total-bid-info');
            info.innerText = `Total Bids: ${total} (Required: ${minRequired})`;
            info.style.color = total >= minRequired ? "#27ae60" : "#e74c3c";
            return total;
        }

        function setResult(index, won) {
            const bid = parseInt(document.getElementById(`bid-${index}`).value);
            let points;

            // قانون الـ 30: إذا اللاعب فوق الـ 30 النقاط لا تضاعف
            if (scores[index] >= 30) {
                points = bid;
            } else {
                points = bidPoints[bid] || bid;
            }

            tempResults[index] = won ? points : -points;
            document.getElementById(`status-${index}`).innerText = won ? "✅" : "❌";
        }

        function submitRound() {
            const minRequired = isAnyoneAbove30() ? 13 : 12;
            if (updateTotalBidCount() < minRequired) {
                alert(`مجموع المزايدات يجب أن يكون على الأقل ${minRequired}!`);
                return;
            }

            if (tempResults.includes(null)) {
                alert("يرجى تحديد (✔) أو (✖) لكل اللاعبين!");
                return;
            }

            const row = document.createElement('tr');
            row.innerHTML = `<td>${currentRound}</td>` + tempResults.map(r => `<td>${r}</td>`).join('');
            document.getElementById('score-body').appendChild(row);

            tempResults.forEach((val, i) => scores[i] += val);
            updateTotals();
            
            if (checkWinner()) return;

            currentRound++;
            document.getElementById('round-title').innerText = `Round ${currentRound}`;
            setupInputs();
        }

        function updateTotals() {
            let html = "<td>Sum</td>";
            scores.forEach(s => html += `<td>${s}</td>`);
            document.getElementById('total-scores').innerHTML = html;
        }

        function checkWinner() {
            const g1Wins = (scores[0] >= 41 || scores[1] >= 41) && (scores[0] >= 0 && scores[1] >= 0);
            const g2Wins = (scores[2] >= 41 || scores[3] >= 41) && (scores[2] >= 0 && scores[3] >= 0);

            if (g1Wins || g2Wins) {
                let winnerNames = "";
                if (g1Wins && g2Wins) {
                    winnerNames = (scores[0]+scores[1] > scores[2]+scores[3]) ? 
                        `${players[0]} & ${players[1]}` : `${players[2]} & ${players[3]}`;
                } else {
                    winnerNames = g1Wins ? `${players[0]} & ${players[1]}` : `${players[2]} & ${players[3]}`;
                }
                showWinner(winnerNames);
                return true;
            }
            return false;
        }

        function showWinner(names) {
            document.getElementById('score-sheet').classList.add('hidden');
            document.getElementById('winner-page').classList.remove('hidden');
            document.getElementById('winner-text').innerText = `${names} WIN!`;
        }
    </script>
</body>
</html>
